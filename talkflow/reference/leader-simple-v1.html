<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Conversation Leader Reference</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../conversation.css"></head><body><main id="reference"></main><script>fetch("student-simple-v1.html").then(r=>r.text()).then(html=>{const doc=new DOMParser().parseFromString(html,"text/html"),article=doc.querySelector("article");article.classList.add("simple-leader-handout");article.querySelectorAll(".simple-header em").forEach(e=>e.textContent=e.textContent.replace("STUDENT","LEADER"));const notes=["경험이 없는 학습자는 최근 본 별점으로 답하게 해요.","답이 짧으면 구체적인 근거 한 가지를 요청해요.","세 후기의 정보량과 균형을 비교하게 해요.","마지막 답은 다음 행동으로 끝내요."];[...article.querySelectorAll(".simple-story,.simple-section:not(.simple-english):not(.simple-reset):not(.simple-result)")].slice(0,4).forEach((section,index)=>section.insertAdjacentHTML("beforeend",`<aside class="simple-leader-note"><b>LEADER</b><span>${notes[index]}</span></aside>`));article.querySelectorAll(".a4-page").forEach(page=>page.insertAdjacentHTML("beforeend",'<footer class="simple-emergency"><span>Could you say a little more?</span><span>Who has a different view?</span><span>What is your reason?</span><span>Let’s make one group answer.</span><b>시간이 부족하면 질문 하나를 줄이고 그룹 결과는 반드시 남겨요.</b></footer>'));document.querySelector("#reference").append(article)});</script></body></html>
